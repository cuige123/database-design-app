plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.querypad.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.querypad.offline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    // Keep the existing single-page app as the bundled offline asset.
    sourceSets {
        getByName("main") {
            assets.srcDirs("../../")
            assets.exclude("android/**")
            assets.exclude(".git/**")
            assets.exclude(".codex/**")
            assets.exclude(".agents/**")
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
