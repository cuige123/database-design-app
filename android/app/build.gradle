plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.querypad.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.querypad.offline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    // Keep the existing single-page app as the bundled offline asset.
    sourceSets {
        getByName("main") {
            assets.srcDirs("../../")
            assets.exclude("android/**")
            assets.exclude("node_modules/**")
            assets.exclude(".git/**")
            assets.exclude(".github/**")
            assets.exclude(".codex/**")
            assets.exclude(".agents/**")
            assets.exclude("tests/**")
            assets.exclude("deploy/**")
            assets.exclude("server.js")
            assets.exclude("package.json")
            assets.exclude("package-lock.json")
            assets.exclude("README.md")
            assets.exclude("启动MySQL实验室.bat")
            assets.exclude("*.log")
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
