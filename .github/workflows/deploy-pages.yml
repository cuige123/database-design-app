name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p dist/vendor/sql.js
          cp index.html manifest.json sw.js ai-config.js ai-assistant.js assistant.css \
             brand-logo.jpg er-editor.js concept-er-editor.js er-recognizer.js fallback.js offline-engine.js \
             self-test.js sqlite-engine.js dist/
          cp vendor/sql.js/sql-wasm.js vendor/sql.js/sql-wasm.wasm vendor/sql.js/LICENSE dist/vendor/sql.js/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
